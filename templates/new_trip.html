{% extends "layout.html" %}

{% block title %}Plan New Trip - HaulSafe{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm mt-3">
            <div class="card-body p-4">
                <h3 class="fw-bold mb-4">Plan a New Trip</h3>

                <form method="POST" action="/manager/new_trip">
                    <div class="mb-3">
                        <label class="form-label">Origin City</label>
                        <input type="text" name="origin" class="form-control" placeholder="e.g. Delhi" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Destination City</label>
                        <input type="text" name="destination" class="form-control" placeholder="e.g. Mumbai" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Cargo Type</label>
                        <select name="cargo_type" class="form-select" required>
                            <option value="">Select cargo type</option>
                            <option value="General Goods">General Goods</option>
                            <option value="Fragile Goods">Fragile Goods</option>
                            <option value="Perishable / Temperature Sensitive">Perishable / Temperature Sensitive</option>
                            <option value="Heavy Machinery">Heavy Machinery</option>
                            <option value="Chemicals / Hazmat">Chemicals / Hazmat</option>
                            <option value="Livestock">Livestock</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Cargo Constraints</label>
                        <div class="form-check">
                            <input type="checkbox" name="cargo_fragile" class="form-check-input" id="fragile">
                            <label class="form-check-label" for="fragile">Fragile — avoid rough roads</label>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" name="cargo_temp_sensitive" class="form-check-input" id="temp">
                            <label class="form-check-label" for="temp">Temperature Sensitive — minimize travel time</label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-dark w-100">Plan Trip & Get Route</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
